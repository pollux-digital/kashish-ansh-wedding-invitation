<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1000" role="img" aria-labelledby="title desc">
  <title id="title">Save the Date — Kashish and Ansh</title>
  <desc id="desc">A romantic ivory invitation card with the names Kashish and Ansh in red script.</desc>
  <defs>
    <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fffdfb"/><stop offset=".56" stop-color="#fff6f1"/><stop offset="1" stop-color="#f6e3df"/></linearGradient>
    <linearGradient id="ruby" x1="0" x2="1" y2="1"><stop stop-color="#d68b83"/><stop offset=".42" stop-color="#a91f35"/><stop offset=".7" stop-color="#ef9b8d"/><stop offset="1" stop-color="#84172d"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <rect width="720" height="1000" rx="20" fill="url(#paper)"/>
  <ellipse cx="360" cy="820" rx="330" ry="140" fill="#dfaaa0" opacity=".24" filter="url(#soft)"/>
  <rect x="28" y="28" width="664" height="944" rx="14" fill="none" stroke="#a91f35" stroke-opacity=".3"/>
  <rect x="40" y="40" width="640" height="920" rx="12" fill="none" stroke="#c87d79" stroke-opacity=".42"/>
  <g fill="none" stroke="url(#ruby)" stroke-width="2" opacity=".72">
    <path d="M360 125c-62 0-112 50-112 112s50 112 112 112 112-50 112-112-50-112-112-112Z"/>
    <path d="M360 145c-51 0-92 41-92 92s41 92 92 92 92-41 92-92-41-92-92-92Z"/>
    <path d="M360 119v21m0 188v21M241 237h21m198 0h21M276 153l15 15m138 138 15 15m0-168-15 15m-138 138-15 15"/>
  </g>
  <text x="360" y="250" text-anchor="middle" fill="#9f1f34" font-family="Montserrat,Arial,sans-serif" font-size="21" letter-spacing="8">SAVE THE DATE</text>
  <path d="M230 390h110m40 0h110" stroke="#bd7375" stroke-width="1" opacity=".7"/>
  <path d="m360 380 10 10-10 10-10-10z" fill="url(#ruby)"/>
  <text x="360" y="510" text-anchor="middle" fill="url(#ruby)" font-family="'Great Vibes','Brush Script MT',cursive" font-size="108">Kashish</text>
  <text x="360" y="602" text-anchor="middle" fill="#a91f35" font-family="'Cormorant Garamond',Georgia,serif" font-size="54" font-style="italic">&amp;</text>
  <text x="360" y="710" text-anchor="middle" fill="url(#ruby)" font-family="'Great Vibes','Brush Script MT',cursive" font-size="116">Ansh</text>
  <path d="M274 770h172" stroke="#bd7375" stroke-width="1" opacity=".6"/>
  <text x="360" y="835" text-anchor="middle" fill="#8b3441" font-family="'Cormorant Garamond',Georgia,serif" font-size="29" font-style="italic">A celebration of love</text>
  <text x="360" y="900" text-anchor="middle" fill="#a91f35" font-family="Montserrat,Arial,sans-serif" font-size="15" letter-spacing="5">WITH LOVE, KASHISH &amp; ANSH</text>
</svg>
